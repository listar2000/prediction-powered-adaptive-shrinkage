[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pas"
version = "0.1.0"
description = "Prediction-Powered Adaptive Shrinkage Estimation"
requires-python = ">=3.9,<3.14"
dependencies = [
    "h5py>=3.8",
    "matplotlib>=3.5",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "seaborn>=0.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel"]
finetune = ["torch>=2.5", "transformers>=4.45"]
# Nonparametric MLE prior fitting for the EB-NPMLE confidence intervals.
# `npeb` solves the NPMLE convex program via cvxpy and currently requires
# the Mosek backend. Mosek itself is commercial but offers free academic
# licenses; see the README installation guide for setup instructions.
npmle = ["npeb>=0.0.2", "cvxpy>=1.4", "mosek>=11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.csv", "*.h5", "*.npz"]
